name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore FsGettextUtils.sln

    - name: Build
      run: dotnet build FsGettextUtils.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test FsGettextUtils.sln --configuration Release --no-build
